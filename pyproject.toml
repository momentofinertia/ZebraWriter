[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zebrawriter"
version = "0.5.0rc16"
description = "Zebra GC420t odaklı yerel termal baskı uygulaması"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Printing",
]
dependencies = [
  "Pillow>=11.0,<13",
  "pypdf>=5.0,<7",
  "PySide6>=6.8,<7",
  "pywin32>=308; sys_platform == 'win32'",
  "qrcode>=8.0,<9",
  "keyring>=25.0,<27",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
release = ["pyinstaller>=6.11,<7"]

[project.scripts]
zebra-writer = "thermal_app.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["src"]
